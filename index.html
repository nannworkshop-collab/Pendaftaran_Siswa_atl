<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Siswa | SMK Atlantis Plus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bubbles" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span>
  </div>

  <header class="header">
    <h1>Pendaftaran Siswa/i</h1>
    <h2>SMK Atlantis Plus</h2>
    <p>Silakan lengkapi data pendaftaran di bawah ini.</p>
  </header>

  <main>
    <form id="formPendaftaran">
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama"
             placeholder="Masukkan nama lengkap" required>

      <fieldset>
        <legend>Jenis Kelamin</legend>
        <div class="radio-group">
          <label><input type="radio" name="kelamin" value="Laki-laki" required> Laki-laki</label>
          <label><input type="radio" name="kelamin" value="Perempuan"> Perempuan</label>
        </div>
      </fieldset>

      <label for="jurusan">Pilihan Jurusan</label>
      <select id="jurusan" name="jurusan" required>
        <option value="">-- Pilih Jurusan --</option>
        <option value="MPLB">MPLB</option>
        <option value="LKC">LKC</option>
        <option value="TJKT">TJKT</option>
        <option value="DKV">DKV</option>
        <option value="Broadcasting">Broadcasting</option>
      </select>

      <label for="alamat">Alamat Lengkap</label>
      <textarea id="alamat" name="alamat" rows="4"
                placeholder="Masukkan alamat lengkap" required></textarea>

      <button type="submit">Kirim Pendaftaran</button>
      <p class="note">Demo latihan. Gunakan data fiktif, bukan data pribadi sungguhan.</p>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
